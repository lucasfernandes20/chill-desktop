name: CI Pipeline

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm ci

      - name: ✅ Lint do código
        run: npm run lint

      - name: 🧪 Testes unitários
        run: npm run test -- --ci --code-coverage

      - name: 🛠️ Build do projeto
        run: npm run build
