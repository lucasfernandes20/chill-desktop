name: CI Pipeline

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🛠️ Instalar ts-node (para rodar o script)
        run: npm install ts-node typescript --save-dev

      - name: 🧪 Gerar arquivo de environment
        run: npm run generate:env
        env:
          NODE_ENV: production
          OPEN_WEATHER_API_KEY: ${{ secrets.OPEN_WEATHER_API_KEY }}
          OPEN_WEATHER_API_URL: ${{ secrets.OPEN_WEATHER_API_URL }}
          CURRENCY_API_URL: ${{ secrets.CURRENCY_API_URL }}

      - name: 🎨 Verificar formatação do código
        run: npm run format:check

      - name: ✅ Lint do código
        run: npm run lint

      - name: 🧪 Testes unitários
        run: npm run test -- --ci --code-coverage

      - name: 🛠️ Build do projeto
        run: npm run build
