<div
  class="bg-background/50 backdrop-blur-sm border border-border rounded-2xl p-3 w-min fixed bottom-6 left-1/2 -translate-x-1/2"
  role="navigation"
  aria-label="Barra de navegação de aplicativos"
>
  <ul class="flex items-center justify-between gap-3">
    @if (apps$ | async; as apps) {
      @if (apps.length > 0) {
        @for (app of apps; track app?.id) {
          @if (app?.isVisible) {
            <li class="relative group transition-all duration-300" data-testid="app-item">
              <button
                mat-mini-fab
                [attr.aria-label]="app?.name"
                [matTooltip]="app?.name"
                [matTooltipPosition]="'above'"
                class="group-hover:scale-110 focus-visible:scale-110"
              >
                <mat-icon aria-hidden="true">{{ app?.icon }}</mat-icon>
                <span class="cdk-visually-hidden">{{ app?.name }}</span>
              </button>
              <div
                class="hidden group-hover:block group-focus-within:block absolute -bottom-3 left-1/2 -translate-x-1/2 w-3 h-1 rounded-full bg-foreground"
                aria-hidden="true"
              ></div>
            </li>
          }
        }
      } @else {
        <li class="hover:scale-110 transition-all duration-300" data-testid="add-app-button">
          <button
            mat-mini-fab
            aria-label="Adicionar aplicativo"
            [matTooltip]="'Add app'"
            [matTooltipPosition]="'above'"
          >
            <mat-icon aria-hidden="true">add</mat-icon>
            <span class="cdk-visually-hidden">Adicionar aplicativo</span>
          </button>
        </li>
      }
    }
  </ul>
</div>
